apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "explo.fullname" . }}
  labels:
    {{- include "explo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.deploymentStrategy.type }}
  selector:
    matchLabels:
      {{- include "explo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "explo.selectorLabels" . | nindent 8 }}
      {{- if eq (include "explo.authConfigured" .) "true" }}
      annotations:
        checksum/auth: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- end }}
    spec:
      containers:
        - name: explo
          image: "{{ .Values.image.repository }}:{{ include "explo.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 7288
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if eq (include "explo.authConfigured" .) "true" }}
            - name: UI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "explo.authSecretName" . }}
                  key: {{ .Values.auth.usernameKey }}
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "explo.authSecretName" . }}
                  key: {{ .Values.auth.passwordKey }}
            {{- end }}
            {{- range $key, $value := .Values.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/ui/setup-status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if .Values.persistence.config.enabled }}
            - name: config
              mountPath: /opt/explo/config
            {{- end }}
            {{- if .Values.persistence.media.enabled }}
            - name: media
              mountPath: {{ .Values.persistence.media.mountPath }}
              {{- with .Values.persistence.media.subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if .Values.persistence.config.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ include "explo.configClaimName" . }}
        {{- end }}
        {{- if .Values.persistence.media.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "explo.mediaClaimName" . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
